<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso - Legajo Docente CERTUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">Legajo Docente CERTUS</h4>
            <p class="text-muted">Prototipo · Ingresa con tu cuenta institucional</p>

            <form action="docentes.html">
              <label for="correo" class="form-label">Correo institucional</label>
              <input type="email" class="form-control mb-2" id="correo" name="correo"
                placeholder="usuario@certus.edu.pe">

              <!--
                Si el correo no termina en @certus.edu.pe, aquí aparecería este mensaje en rojo:
                <p class="text-danger small">Usa tu correo institucional (@certus.edu.pe).</p>
              -->

              <button type="submit" class="btn btn-primary mt-2">Ingresar</button>
            </form>

            <p class="text-muted small mt-3 mb-0">Simulación: acepta cualquier correo que termine en @certus.edu.pe.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
