<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docentes - Legajo Docente CERTUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ===== MENÚ SUPERIOR  ===== -->
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="docentes.html">Legajo Docente CERTUS</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <!-- Aquí iría el correo de la persona que inició sesión -->
        <span class="navbar-text me-md-3">leonardo@certus.edu.pe</span>
        <a class="btn btn-outline-light" href="login.html">Salir</a>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <div class="container my-4">

    <!-- Aviso de sesión iniciada -->
    <div class="alert alert-success" role="alert">
      Sesión iniciada correctamente.
    </div>

    <!-- Pestañas: Docentes y Reportes -->
    <ul class="nav nav-pills mb-3">
      <li class="nav-item">
        <a class="nav-link active" href="docentes.html">Docentes</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="reportes.html">Reportes</a>
      </li>
    </ul>

    <!-- Buscador y botón de nuevo docente (RF2) -->
    <div class="card mb-3">
      <div class="card-body">
        <form>
          <label for="buscar" class="form-label">Buscar docente o carrera</label>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" id="buscar" name="buscar">
            </div>
            <div class="col-12 col-md-6 d-grid">
              <a class="btn btn-primary" href="registrar_docente.html">+ Nuevo docente</a>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de docentes: una tarjeta por docente -->
    <div class="row g-3">

      <!--
        AQUÍ IRÍA EL FOR:
        por cada docente guardado en docentes.txt se repite la tarjeta de abajo
        con su nombre, carrera, correo y promedio.
        Por ahora dejamos una sola tarjeta de ejemplo.
      -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">María Torres Quispe</h5>
            <p class="card-text mb-1 text-muted">Administración</p>
            <p class="card-text mb-1">mtorres@certus.edu.pe</p>
            <p class="card-text">Promedio: <strong>17.8</strong></p>
            <a class="btn btn-primary btn-sm" href="ficha.html">Ficha</a>
            <a class="btn btn-outline-primary btn-sm" href="editar_docente.html">Editar</a>
          </div>
        </div>
      </div>
      <!-- AQUÍ TERMINARÍA EL FOR -->

    </div>
  </div>

  <!-- JavaScript de Bootstrap (siempre al final del body): hace funcionar el menú plegable del celular -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
