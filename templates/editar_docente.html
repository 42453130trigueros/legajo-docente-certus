<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar docente - Legajo Docente CERTUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- ===== MENÚ SUPERIOR  ===== -->
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/docentes">Legajo Docente CERTUS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu"
        aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <span class="navbar-text me-md-3">{{ session.get("correo", "") }} · {{ session.get("rol", "") }}</span>
        <a class="btn btn-outline-light" href="/login">Salir</a>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <div class="container my-4">

    <!-- Pestañas  -->
    <ul class="nav nav-pills mb-3">
      <li class="nav-item">
        <a class="nav-link active" href="/docentes">Docentes</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/reportes">Reportes</a>
      </li>
      {% if session.get("rol") == "administrador" %}
      <li class="nav-item">
        <a class="nav-link" href="/usuarios">Usuarios</a>
      </li>
      {% endif %}
    </ul>

    <!-- Formulario para editar un docente  -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">Editar docente</h5>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" name="nombre" value="{{ docente.get('nombre', '') }}">
            </div>

            <div class="col-12 col-md-6">
              <label for="correo" class="form-label">Correo institucional</label>
              <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@certus.edu.pe"
                value="{{ docente.get('correo', '') }}">
            </div>

            <div class="col-12 col-md-4">
              <label for="carrera" class="form-label">Carrera</label>
              <select class="form-select" id="carrera" name="carrera">
                <option value="">Seleccionar carrera</option>
                {% for c in ["Administración", "Contabilidad", "Sistemas"] %}
                <option {% if docente.get("carrera")==c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="telefono" name="telefono"
                value="{{ docente.get('telefono', '') }}">
            </div>

            <div class="col-12 col-md-4">
              <label for="ingreso" class="form-label">Fecha de ingreso</label>
              <input type="date" class="form-control" id="ingreso" name="ingreso"
                value="{{ docente.get('ingreso', '') }}">
            </div>

          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-primary" href="/docentes">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
